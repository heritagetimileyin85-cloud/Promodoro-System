<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Ledger</title>
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;700&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;700&display=swap">

  </head>
<body>

  <h1>Focus Ledger</h1>
  <p id="today"></p>

  <div class="tabs">
    <button id="timerTab" class="tab active">Timer</button>
    <button id="habitsTab" class="tab">Habits</button>
  </div>

  <div id="timerPage" class="page">
    <h2>Timer</h2>

    <div class="modes">
      <button id="focusMode" class="modeButton active">Focus</button>
      <button id="shortMode" class="modeButton">Short break</button>
      <button id="longMode" class="modeButton">Long break</button>
    </div>

    <div class="musicBox">
      <h3>Focus music</h3>

      <button id="musicButton">Play music</button>
      <p id="musicNote"></p>

      <p class="smallNote">Pick a type of music, then pick a track:</p>
      <div id="categoryList"></div>
      <div id="trackList"></div>

      <p>
        <label for="musicVolume">Music volume</label>
        <input type="range" id="musicVolume" min="0" max="100" value="40">
      </p>

      <p>
        <input type="checkbox" id="pauseInBreaks" checked>
        <label for="pauseInBreaks">Pause the music during breaks</label>
      </p>
    </div>

    <div class="ring">
      <svg viewBox="0 0 200 200">
        <circle class="ringBack" cx="100" cy="100" r="90"></circle>
        <circle class="ringFront" id="ringFront" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"></circle>
      </svg>
      <p id="timeLeft">25:00</p>
    </div>

    <button id="startButton">Start</button>
    <button id="resetButton">Reset</button>

    <p id="timerMessage"></p>

    <div id="sessionDots"></div>
    <p id="sessionText"></p>    
    <p class="smallNote">
      <input type="checkbox" id="chimeBox" checked>
      <label for="chimeBox">Play a chime when time is up</label>
    </p>
    
    <div class="lengths">
      <p class="smallNote">Lengths in minutes:</p>
      <label for="focusInput">Focus</label>
      <input type="number" id="focusInput" min="1" max="120" value="25">
      <label for="shortInput">Short break</label>
      <input type="number" id="shortInput" min="1" max="120" value="5">
      <label for="longInput">Long break</label>
      <input type="number" id="longInput" min="1" max="120" value="15">
    </div>
  </div>

  <div id="habitsPage" class="page hidden">
    <h2>Habits</h2>

    <input type="text" id="habitInput" placeholder="Type a new habit">
    <button id="addButton">Add habit</button>

    <p class="smallNote">
      Auto-tick after
      <input type="number" id="targetInput" min="0" max="12" value="0">
      focus sessions in a day (0 = I tick it myself)
    </p>

       <div id="weekSummary"></div>
    <ul id="habitList"></ul>
  </div>

   <script src="myMusic.js"></script>
  <script src="script.js"></script>
</body>
</html>
